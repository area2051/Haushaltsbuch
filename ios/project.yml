# App-Build: cd ios && xcodegen generate && xcodebuild build -project Haushaltsbuch.xcodeproj \
#   -scheme Haushaltsbuch -destination 'platform=iOS Simulator,name=iPhone 17' -skipPackagePluginValidation
# -skipPackagePluginValidation ist nötig, weil HaushaltsbuchAPI das swift-openapi-generator-Build-Plugin
# nutzt (in Xcode stattdessen einmalig „Trust & Enable“ bestätigen).
name: Haushaltsbuch
options:
  bundleIdPrefix: de.haushaltsbuch
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
packages:
  HaushaltsbuchKit:
    path: HaushaltsbuchKit
targets:
  Haushaltsbuch:
    type: application
    platform: iOS
    sources:
      - Haushaltsbuch
    dependencies:
      - package: HaushaltsbuchKit
        product: HaushaltsbuchAPI
      - package: HaushaltsbuchKit
        product: HaushaltsbuchCore
      - package: HaushaltsbuchKit
        product: HaushaltsbuchData
      - package: HaushaltsbuchKit
        product: HaushaltsbuchUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.haushaltsbuch.app
        INFOPLIST_FILE: Haushaltsbuch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - HaushaltsbuchAppUITests
  # Oberflächentests (XCUITest) für die Live-Prüfung gegen einen laufenden Server; nicht Teil von test.sh.
  HaushaltsbuchAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HaushaltsbuchAppUITests
    dependencies:
      - target: Haushaltsbuch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.haushaltsbuch.app.uitests
        GENERATE_INFOPLIST_FILE: YES
