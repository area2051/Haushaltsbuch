services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_USER: haushaltsbuch
      POSTGRES_DB: haushaltsbuch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U haushaltsbuch -d haushaltsbuch"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgres://haushaltsbuch:${POSTGRES_PASSWORD}@postgres:5432/haushaltsbuch
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in .env}
    ports:
      - "${API_PORT:-3000}:3000"

  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./ops/backup.sh:/backup.sh:ro
      - ./ops/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
