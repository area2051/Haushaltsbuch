name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Versionssprung: patch = Fehlerbehebung, minor = neue Funktion, major = großer Umbau"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release anlegen
    # Nur von main aus: Der Release-Commit wird auf main gepusht.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Versionen von server und web müssen übereinstimmen
        run: |
          server=$(node -p "require('./server/package.json').version")
          web=$(node -p "require('./web/package.json').version")
          if [ "$server" != "$web" ]; then
            echo "::error::Versionen weichen ab: server=$server, web=$web"
            exit 1
          fi
      - name: Version erhöhen
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          # --no-git-tag-version: nur package.json und package-lock.json ändern, Commit und Tag folgen unten.
          (cd server && npm version "$BUMP" --no-git-tag-version)
          (cd web && npm version "$BUMP" --no-git-tag-version)
          version=$(node -p "require('./server/package.json').version")
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version existiert bereits"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Committen, taggen, pushen
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json web/package.json web/package-lock.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin HEAD:main "v$VERSION"
      - name: GitHub-Release erstellen
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"
